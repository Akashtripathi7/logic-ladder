<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Logic Ladder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=JSON.parse(localStorage.getItem("dsa:theme"));if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
{{CSS}}
</style>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#path"><span class="brand-mark" aria-hidden="true"></span>Logic Ladder</a>
    <nav class="nav" aria-label="Main">
      <a href="#path" data-k="path">Path</a>
      <a href="#video-math" data-k="math">Math</a>
      <a href="#python" data-k="python">Python</a>
      <a href="#gym" data-k="gym">Logic Gym</a>
      <a href="#warmup" data-k="warmup">Warm-up 50</a>
      <a href="#dsa150" data-k="dsa150">DSA 150</a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">English</button><button type="button" data-l="hi">Hinglish</button></div>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch to night mode" title="Night mode"><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
    <span class="prog-chip" id="prog-chip"></span>
  </div>
</header>
<main class="wrap" id="view"></main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
{{JS}}
</script>
